{% extends "index.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">{% if product %}Редактировать товар{% else %}Новый товар{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="3">{{ product.description if product else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Обычная цена (со скидкой)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price if product else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Старая цена (зачеркнутая, необязательно)</label>
                        <input type="number" step="0.01" name="old_price" class="form-control" value="{{ product.old_price if product and product.old_price else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Количество на складе</label>
                        <input type="number" name="quantity" class="form-control" value="{{ product.quantity if product else '0' }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
